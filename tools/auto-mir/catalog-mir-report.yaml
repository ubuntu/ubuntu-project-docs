- id: REP-UI-001
  section: UI standards
  title: End-user UI applicability
  mode: ev_to_ai
  readiness: warning
  adapters_required: [packaging-source, binary-package-inspection, dep-analysis]
  ai_policy: Judge whether this package is a user-facing graphical desktop program or otherwise a user-visible program whose strings a user reads (the kind an end user launches or directly reads output from), using binary_sections (libs/libdevel/doc/debug strongly indicate NOT user-facing), runtime dependencies (GUI toolkits such as gtk, qt, libadwaita, gnome, kde, wxwidgets indicate user-facing; their absence together with a library/CLI/daemon nature indicates not user-facing), the package description, and general knowledge of the package. Do not use the presence or absence of a desktop file or translations to decide user-facing-ness - a user-facing program missing either is exactly what the follow-up checks must catch.
  question:
    kind: single_choice
    prompt: Is this package end-user facing (a desktop program, or otherwise user-visible)?
    options:
    - id: end-user-facing
      label: End-user facing (desktop program, or otherwise user-visible)
      statement: '- This package is end-user facing; desktop-file and translation applicability are assessed below.'
      leads_to_followup: true
    - id: not-end-user-facing
      label: Not end-user facing (server, CLI-only tool, daemon, or library)
      statement: '- This package is not end-user facing (server, CLI-only tool, daemon, or library), so desktop-file and translation requirements do not apply.'
      leads_to_followup: true
  template: "TODO-A: - Application is not end-user facing (does not need translation)\nTODO-B: - Application is end-user facing, Translation is present, via standard\nTODO-B:   intltool/gettext or similar build and runtime internationalization\nTODO-B:   system see TBD"

- id: REP-STD-002
  section: Standards compliance
  title: License lifetime
  mode: human_only
  readiness: blocker
  rule_context: 'RULE: Licensing must remain compatible with Ubuntu main throughout the full support lifetime. Flag expiry, time-limited grants, entity/contract coupling, withdrawable license branches, patents, or other encumbrances for human review.'
  question:
    kind: single_choice
    prompt: Does the license raise any expiry, time-bound, contract-coupling, or other encumbrance concerns for the full support lifetime?
    options:
    - id: A-no-concerns
      label: No expiry, time-bound terms, or encumbrances were identified
      statement: '- No license expiry, time-bound terms, entity/contract coupling, withdrawable branches, patents, or other encumbrances were identified; the license is expected to remain compatible with Ubuntu main throughout the full support lifetime.'
    - id: B-concerns
      label: A concern was identified and needs explanation
      statement: '- A license concern relevant to the full support lifetime was identified.'
  template: 'TODO-A/B: - License compatibility over the full support lifetime: TBD'
- id: REP-STD-002B
  section: Standards compliance
  title: License lifetime concern details
  mode: human_only
  readiness: blocker
  applicability:
    item: REP-STD-002
    equals: B-concerns
  question:
    kind: multiline
    prompt: Explain the license expiry, time-bound term, contract coupling, or other encumbrance, and why it is still acceptable.
  template: 'TODO: - License lifetime concern details: TBD'
- id: REP-MAINT-001
  section: Maintenance/Owner
  title: Owning team commitment
  mode: human_only
  readiness: blocker
  preface_evaluator: team-subscription
  rule_context: 'RULE: Every package needs an eligible owning team that explicitly accepts long-term maintenance and subscribes before promotion; suggested ownership without acknowledgement is not sufficient.'
  question:
    kind: single_choice
    prompt: Is the team already subscribed to this package (shown above, if any) the owning team, or will a different team take ownership?
    options:
    - id: confirm-subscribed
      label: Keep the already-subscribed team shown above as the owning team
      statement: '- The owning team already subscribed to this package is confirmed and has explicitly acknowledged the long-term maintenance commitment.'
      unavailable_if:
        not:
          evidence: team-mapping.subscribed_teams
          truthy: true
      unavailable_reason: No team is currently subscribed to this package, so there is nothing to confirm.
    - id: new-team
      label: A different team will take ownership
      statement: '- A different owning team will subscribe to this package, named below.'
  template: 'TODO-A/B: - The owning team commitment is: TBD'

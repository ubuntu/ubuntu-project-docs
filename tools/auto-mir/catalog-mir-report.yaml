    kind: single_choice
    prompt: Does this package correctly follow FHS and Debian Policy?
    options:
    - id: A-no-violations
      label: This package correctly follows FHS and Debian Policy
      statement: '- This package correctly follows FHS and Debian Policy.'
      unavailable_if:
        evidence: lintian.lintian_errors
        truthy: true
      unavailable_reason: Lintian reported errors for this package; select the violation option and justify them below.
    - id: B-violations
      label: This package violates FHS or Debian Policy, reasons for that are TBD
      statement: '- This package violates FHS or Debian Policy; the reasons are detailed below.'
  template: 'TODO-A/B: - FHS and Debian Policy compliance or justified violations: TBD'

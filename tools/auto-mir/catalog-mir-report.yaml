schema_version: 1
role: report
metadata:
  title: MIR reporter's template
  section_markers:
  - '[Availability]'
  - '[Rationale]'
  - '[Security]'
  - '[Quality assurance - function/usage]'
  - '[Quality assurance - maintenance]'
  - '[Quality assurance - testing]'
  - '[Quality assurance - packaging]'
  - '[UI standards]'
  - '[Dependencies]'
  - '[Standards compliance]'
  - '[Maintenance/Owner]'
  - '[Background information]'
  reporter_template_blueprint:
  - '[Availability]'
  - 'RULE: The source package must already be published in Ubuntu universe and build for every architecture it is intended to support.'
  - item: REP-AVAIL-001
  - item: REP-AVAIL-002
  - item: REP-AVAIL-003
  - ''
  - '[Rationale]'
  - 'RULE: Main inclusion needs demonstrated Ubuntu demand, correct understanding of main versus universe, and no better supported alternative.'
  - 'RULE: Reuse an existing MIR with a new series task when prior package content, reasoning, and circumstances remain applicable; otherwise reference the prior MIR and explain the difference.'
  - 'RULE: State the exact binary promotion scope and a well-founded major-release deadline, if any; wishes without a definite deadline should be identified as such.'
  - item: REP-RATIONALE-001
  - item: REP-RATIONALE-005
  - item: REP-RATIONALE-006
  - item: REP-RATIONALE-002
  - item: REP-RATIONALE-003
  - item: REP-RATIONALE-004
  - item: REP-RATIONALE-004-SPECIFIC
  - item: REP-RATIONALE-007
  - item: REP-RATIONALE-008
  - item: REP-RATIONALE-009
  - ''
  - '[Security]'
  - 'RULE: Security history and current issues must allow support for the full release lifetime, including LTS and ESM where applicable; consult Ubuntu, Debian, NVD/CVE, and OSS-security sources.'
  - 'RULE: Identify privileged binaries, services, recurring jobs, ports, endpoints, untrusted inputs, security-sensitive extensions, and cryptography. Explain exposure and proportional isolation such as restricted users, capability drops, seccomp, systemd hardening, and AppArmor.'
  - 'RULE: Deprecated algorithms such as 3DES and TLS/SSL 1.1 are unacceptable; report any suspicion for Security review rather than claiming certainty without evidence.'
  - item: REP-SECURITY-001
  - item: REP-SECURITY-003
  - item: REP-SECURITY-004
  - item: REP-SECURITY-005
  - item: REP-SECURITY-006
  - ''
  - '[Quality assurance - function/usage]'
  - 'RULE: After installation, the package must work with reasonable configuration and documentation effort; explain why a safe default is impossible when configuration is required.'
  - item: REP-QA-FUNC-001
  - ''
  - '[Quality assurance - maintenance]'
  - 'RULE: Upstream, Debian, and Ubuntu maintenance must inspire confidence. Evaluate important, old, critical, and security bugs and discuss relevant open issues.'
  - 'RULE: If exotic hardware is required, identify realistic long-term access for debugging, testing, verification, and development; speculative future access provides less confidence.'
  - item: REP-QA-MAINT-001
  - item: REP-QA-MAINT-004
  - item: REP-QA-MAINT-002
  - item: REP-QA-MAINT-003
  - ''
  - '[Quality assurance - testing]'
  - 'RULE: The package must have a non-trivial build-time test suite whose failures fail the build and should have meaningful autopkgtests; explain existing ignored failures.'
  - 'RULE: When automated testing is insufficient or special hardware is required, provide a written test plan, code or documented steps, example logs, and a commitment to execute it on uploads or at least each release cycle.'
  - 'RULE: Exhaust hardware, partner, simulator, upstream, manufacturer, QA, and community options before declaring a case untestable; explain why universe delivery cannot work and the consequences of regressions.'
  - 'RULE: Minimal libraries may rely on wider solution-level end-to-end tests only when that special case and the stronger solution coverage are identified explicitly.'
  - item: REP-QA-TEST-001
  - item: REP-QA-TEST-002
  - item: REP-QA-TEST-003
  - item: REP-QA-TEST-005
  - item: REP-QA-TEST-006
  - item: REP-QA-TEST-007
  - item: REP-QA-TEST-008
  - item: REP-QA-TEST-004
  - ''
  - '[Quality assurance - packaging]'
  - 'RULE: Provide a working upstream release mechanism (debian/watch, upstream metadata, or documented native/repack instructions), a correct Maintainer field, recent build evidence, and complete lintian output.'
  - 'RULE: Explain lintian overrides, avoid obsolete dependencies such as Python 2 and GTK 2, avoid intrusive debconf questions for default installs, and keep debian/ packaging understandable and maintainable.'
  - item: REP-QA-PKG-001
  - item: REP-QA-PKG-002
  - item: REP-QA-PKG-003
  - item: REP-QA-PKG-004
  - item: REP-QA-PKG-005
  - ''
  - '[UI standards]'
  - 'RULE: User-facing applications need appropriate internationalization and standard desktop integration; when either is not applicable, explain why.'
  - item: REP-UI-002
  - ''
  - '[Dependencies]'
  - 'RULE: Runtime dependencies and first alternatives must be in main or covered by MIR. Build-only dependencies may remain in universe unless their active code is embedded in final binaries.'
  - item: REP-DEP-001
  - item: REP-DEP-002
  - item: REP-DEP-003
  - ''
  - '[Standards compliance]'
  - 'RULE: Document and justify major FHS or Debian Policy violations.'
  - 'RULE: Licensing must remain compatible with Ubuntu main throughout the full support lifetime. Flag expiry, time-limited grants, entity/contract coupling, withdrawable license branches, patents, or other encumbrances for human review.'
  - item: REP-STD-001
  - item: REP-STD-001B
  - item: REP-STD-002
  - item: REP-STD-002B
  - ''
  - '[Maintenance/Owner]'
  - 'RULE: Every package needs an eligible owning team that explicitly accepts long-term maintenance and subscribes before promotion; suggested ownership without acknowledgement is not sufficient.'
  - 'RULE: Static and vendored builds impose rebuild, testing, tracking, refresh, copyright, update, and backport commitments for the full release lifetime, including ESM. New vendored components require renewed agreement.'
  - 'RULE: Rust packages currently vendor non-runtime dependencies and use the supported cargo packaging path; all vendored ecosystems need reproducible dependency tracking and refresh documentation.'
  - 'RULE: Provide a build from the last three months and coordinate in advance with every team affected by the promotion.'
  - item: REP-MAINT-001
  - item: REP-MAINT-001B
  - item: REP-MAINT-002
  - item: REP-MAINT-003
  - item: REP-MAINT-004
  - item: REP-MAINT-005
  - item: REP-MAINT-006
  - ''
  - '[Background information]'
  - 'RULE: Package descriptions must explain purpose and context. Explain renamed packages or differing upstream names and link the upstream project.'
  - item: REP-BG-001
  - item: REP-BG-002
  - item: REP-BG-003
items:
- id: REP-AVAIL-001
  section: Availability
  title: Source package availability
  mode: deterministic
  evaluator: source-availability
  adapters_required: [lp-package-api]
  template: 'TODO: - The package TBDSRC is already in Ubuntu universe.'
- id: REP-AVAIL-002
  section: Availability
  title: Architecture build state
  mode: deterministic
  evaluator: build-architectures
  adapters_required: [lp-build-api]
  template: 'TODO: - It currently builds and works for architectures: TBD'
- id: REP-AVAIL-003
  section: Availability
  title: Source package link
  mode: deterministic
  evaluator: source-link
  adapters_required: []
  template: 'TODO: - Link to package https://launchpad.net/ubuntu/+source/TBDSRC'
- id: REP-RATIONALE-001
  section: Rationale
  title: Main-inclusion reason
  mode: human_only
  readiness: blocker
  question:
    kind: multiline
    prompt: Why is this source package required in Ubuntu main?
  template: 'TODO: - The package TBDSRC is required in Ubuntu main for TBD'
- id: REP-RATIONALE-005
  section: Rationale
  title: User benefit scope
  mode: human_only
  readiness: blocker
  question:
    kind: single_choice
    prompt: Is this broadly useful, or important for a narrower use case?
    options:
    - id: broad
      label: Broadly useful to a large part of the user base
      statement: '- The package TBDSRC will generally be useful for a large part of our user base.'
    - id: niche
      label: Narrower use case that still matters
      statement: '- The package TBDSRC serves a narrower but important Ubuntu use case.'
  template: 'TODO-A/B: - User benefit scope: TBD'
- id: REP-RATIONALE-006
  section: Rationale
  title: Narrow use-case explanation
  mode: human_only
  readiness: blocker
  applicability:
    item: REP-RATIONALE-005
    equals: niche
  question:
    kind: multiline
    prompt: Why is the narrower use case important enough to justify main inclusion?
  template: 'TODO: - The narrower use case is important because TBD'
- id: REP-RATIONALE-002
  section: Rationale
  title: User benefit
  mode: human_only
  readiness: blocker
  question:
    kind: multiline
    prompt: Describe the Ubuntu users and use cases that benefit from this promotion.
  template: 'TODO: - The Ubuntu user benefit and enabled use cases are TBD'
- id: REP-RATIONALE-003
  section: Rationale
  title: Alternatives considered
  mode: ev_to_ai
  readiness: warning
  adapters_optional: [dup-search]
  rule_context: 'RULE: Main inclusion needs demonstrated Ubuntu demand, correct understanding of main versus universe, and no better supported alternative.'
  answer_guidance: Only alternatives already in Ubuntu main count against inclusion; a similar package in universe is not itself a reason to reject this promotion.
  ai_policy: Assess only whether the supplied archive candidates plausibly overlap this package's stated functionality. For each credible candidate, state its name and archive component (main/universe/...); a candidate already in main is the relevant kind of alternative, a candidate in universe is not a blocker but may still be worth naming. Name candidates and uncertainty; do not decide Ubuntu demand or invent alternatives. Your statement must not merely restate which candidates were found - it must commit to one of (a) no genuine overlap with anything in main exists, (b) this package overlaps a named main candidate and is meant to replace it, or (c) this package overlaps a named main candidate but is still needed in addition, for a stated reason. If the evidence does not let you decide which of (a)/(b)/(c) applies, set requires_reporter_decision to true and phrase the statement as a clear, direct question for the reporter to resolve.
  question:
    kind: multiline
    prompt: What alternatives already in main were considered, and why are they insufficient?
  template: 'TODO: - There is no other/better way already in main; alternatives considered: TBD'
- id: REP-RATIONALE-004
  section: Rationale
  title: Promotion binary scope
  mode: human_only
  readiness: blocker
  adapters_optional: [packaging-source]
  preface_evaluator: binary-packages
  rule_context: 'RULE: State the exact binary promotion scope and a well-founded major-release deadline, if any; wishes without a definite deadline should be identified as such.'
  answer_guidance: Choose a shortcut if the whole source (or everything except -dev/-doc/-dbg) applies, or pick "specific binary packages" to list them yourself below.
  question:
    kind: single_choice
    prompt: Which binary packages need promotion to main?
    options:
    - id: __all_binaries__
      label: All binary packages built by this source
      statement: '- All binary packages built by TBDSRC need to be in main.'
      exclusive: true
      spell_out_filter: all
    - id: __all_except_dev_doc_dbg__
      label: All binary packages except -dev, -doc, and -dbg(sym) packages
      statement: '- All binary packages built by TBDSRC, except -dev, -doc, and debug-symbol packages, need to be in main.'
      exclusive: true
      spell_out_filter: exclude_dev_doc_dbg
    - id: specific-packages
      label: A specific subset of binary packages (list them below)
      statement: '- Specific binary packages built by TBDSRC, listed below, need to be in main.'
      spell_out_filter: list_only
    options_source:
      adapter: packaging-source
      field: binary_package_names
  template: 'TODO: - The binary packages TBD need to be in main.'
- id: REP-RATIONALE-004-SPECIFIC
  section: Rationale
  title: Specific binary packages
  mode: human_only
  readiness: blocker
  applicability:
    item: REP-RATIONALE-004
    equals: specific-packages
  preface_evaluator: binary-packages
  answer_guidance: List the specific binary package names that need to move to main, separated by commas or one per line.
  question:
    kind: multiline
    prompt: Which specific binary packages need promotion to main?
  template: 'TODO: - The specific binary packages needing promotion are TBD'
- id: REP-RATIONALE-007
  section: Rationale
  title: Target deadline
  mode: human_only
  readiness: warning
  question:
    kind: single_choice
    prompt: Is there a well-founded release deadline?
    options:
    - id: required-by
      label: Yes, a well-founded deadline exists
      statement: '- The package TBDSRC is required in Ubuntu main by a defined deadline.'
    - id: no-deadline
      label: No definitive deadline
      statement: '- The package would be useful in main, but there is no definitive deadline.'
  template: 'TODO-A/B: - Target deadline: TBD'
- id: REP-RATIONALE-008
  section: Rationale
  title: Deadline details
  mode: human_only
  readiness: warning
  applicability:
    item: REP-RATIONALE-007
    equals: required-by
  answer_guidance: State the deadline as a date or release you need this in main. Most often one would specify a freeze type and its date.
  question:
    kind: multiline
    prompt: What is the deadline, and why is it well founded?
  template: 'TODO: - Required in main no later than TBD'
- id: REP-RATIONALE-009
  section: Rationale
  title: Previous MIR and main history
  mode: deterministic
  evaluator: prior-mir-history
  readiness: warning
  adapters_required: [lp-mir-history]
  template: 'TODO-A/B: - First inclusion or previous-main/MIR history: TBD'
- id: REP-SECURITY-001
  section: Security
  title: Security history
  mode: deterministic
  evaluator: cve-history
  readiness: warning
  adapters_required: [ubuntu-cve-tracker, nvd-enrich]
  template: 'TODO: - Security history and relevant CVEs: TBD'
- id: REP-SECURITY-003
  section: Security
  title: Installed privilege and service surface
  mode: deterministic
  evaluator: binary-security-surface
  readiness: warning
  adapters_required: [binary-package-inspection]
  template: 'TODO: - Installed setuid/setgid, sbin, service, timer, and recurring-job surface: TBD'
- id: REP-SECURITY-004
  section: Security
  title: Installed isolation and extension surface
  mode: deterministic
  evaluator: binary-integration-surface
  readiness: warning
  adapters_required: [binary-package-inspection]
  template: 'TODO: - Installed AppArmor, desktop, translation, and plugin/extension surface: TBD'
- id: REP-SECURITY-005
  section: Security
  title: Exposure and mitigation assessment
  mode: ev_to_ai
  readiness: warning
  adapters_required: [packaging-source, binary-package-inspection]
  rule_context: 'RULE: Identify privileged binaries, services, recurring jobs, ports, endpoints, untrusted inputs, security-sensitive extensions, and cryptography. Explain exposure and proportional isolation such as restricted users, capability drops, seccomp, systemd hardening, and AppArmor.'
  ai_policy: Assess bounded evidence for privileged operation, exposed listeners/endpoints/ports, parsers of untrusted input, security-sensitive extensions, deprecated cryptographic patterns, and whether mitigations (restricted users, capability drops, seccomp, systemd hardening, AppArmor) are proportional to that exposure. Never claim exhaustive absence when source evidence is incomplete. Your statement must commit to one of (a) mitigations are proportional to the exposure, or (b) mitigations are not proportional, naming the specific gap(s). If the evidence does not let you decide between (a) and (b), set requires_reporter_decision to true.
  question:
    kind: multiline
    prompt: Assess security-sensitive behavior, exposed endpoints, privileged operation, cryptography, and whether mitigations are proportional.
  template: 'TODO: - Security exposure and proportional mitigation assessment: TBD'
- id: REP-SECURITY-006
  section: Security
  title: Deprecated cryptography scan
  mode: ev_to_ai
  readiness: warning
  adapters_optional: [packaging-source]
  rule_context: 'RULE: Deprecated algorithms such as 3DES and TLS/SSL 1.1 are unacceptable; report any suspicion for Security review rather than claiming certainty without evidence.'
  answer_guidance: The evidence is a best-effort textual scan for deprecated algorithm names (MD5, SHA1, 3DES, RC4, SSLv2/3, TLSv1.0); a hit is not proof of use and no hits is not proof of absence.
  ai_policy: Evidence is a best-effort grep of the source tree for deprecated cryptographic algorithm name patterns (packaging-source.crypto_pattern_hits), each as a path:line:content match. If hits exist, list the distinct files/lines and state that the reporter should confirm whether the algorithm is actually used before flagging Security review. If the list is empty, state plainly that the pattern search found no deprecated-algorithm indicators, while noting this is not an exhaustive proof of absence.
  question:
    kind: multiline
    prompt: Confirm or correct - does anything suggest deprecated cryptographic algorithms that Security review should see?
  template: 'TODO: - Deprecated cryptographic algorithm concerns: TBD'
- id: REP-QA-FUNC-001
  section: Quality assurance - function/usage
  title: Installed usability
  mode: ev_to_ai
  readiness: warning
  adapters_required: [packaging-source, binary-package-inspection]
  rule_context: 'RULE: After installation, the package must work with reasonable configuration and documentation effort; explain why a safe default is impossible when configuration is required.'
  ai_policy: Assess whether the package works immediately after installation or needs configuration, using packaging-source.debconf_templates (debconf prompts shown during install), packaging-source.service_files and binary-package-inspection.systemd_units (services that may need enabling or configuration before use), and packaging-source.source_description for context. If nothing suggests required configuration, state plainly that it works with sane defaults. If configuration appears required, name what (e.g. debconf templates, a service that is not enabled by default) and explain, from the evidence, why a safe default is not possible; do not invent reasons the evidence does not support.
  question:
    kind: multiline
    prompt: Does the package work after installation, or what configuration/documentation is required? If configuration is required, why is a safe default not possible?
  template: 'TODO: - Package function after installation and required configuration: TBD'
- id: REP-QA-MAINT-001
  section: Quality assurance - maintenance
  title: Important open bugs
  mode: deterministic
  evaluator: important-bugs
  readiness: warning
  adapters_required: [lp-bug-search-api, debian-bts]
  adapters_optional: [upstream-tracker]
  template: 'TODO: - Important Ubuntu, Debian, and upstream bugs: TBD'
- id: REP-QA-MAINT-004
  section: Quality assurance - maintenance
  title: Exotic hardware availability
  mode: human_only
  readiness: blocker
  question:
    kind: single_choice
    prompt: Does maintenance depend on exotic hardware unavailable to ordinary infrastructure?
    options:
    - id: no-exotic-hardware
      label: No exotic hardware is required
      statement: '- The package does not depend on exotic hardware we cannot support.'
      readiness: clear
    - id: team-access
      label: Exotic hardware is required and accessible to the team
      statement: '- Required exotic hardware is available to the owning team for debugging, testing, verification, and development.'
      readiness: blocker
    - id: other-special
      label: Something else / a special situation applies
      statement: '- Exotic hardware access follows a different, situation-specific arrangement; see the details below.'
      readiness: blocker
  template: 'TODO-A/B/C: - Exotic hardware availability: TBD'
- id: REP-QA-MAINT-002
  section: Quality assurance - maintenance
  title: Hardware access
  mode: human_only
  readiness: warning
  applicability:
    any:
    - item: REP-QA-MAINT-004
      equals: team-access
    - item: REP-QA-MAINT-004
      equals: other-special
  question:
    kind: multiline
    prompt: Describe how the owning team can/will access the required exotic hardware for debugging, testing, verification, and development.
  template: 'TODO: - Exotic hardware requirements and team access: TBD'
- id: REP-QA-MAINT-003
  section: Quality assurance - maintenance
  title: Maintenance health assessment
  mode: ev_to_ai
  readiness: warning
  adapters_required: [lp-bug-search-api, debian-bts]
  adapters_optional: [upstream-tracker, lp-package-api]
  ai_policy: Summarize tracker counts, important bug age/severity, and release cadence. Distinguish observable history from the reporter's final maintenance judgment.
  question:
    kind: multiline
    prompt: Assess Ubuntu, Debian, and upstream maintenance health and explain important concerns.
  template: 'TODO: - The package maintenance health is: TBD'
- id: REP-QA-TEST-001
  section: Quality assurance - testing
  title: Build-time tests
  mode: deterministic
  evaluator: build-tests
  readiness: warning
  adapters_required: [fetch-build, packaging-source]
  template: 'TODO: - Build-time test execution and failure gating: TBD'
- id: REP-QA-TEST-002
  section: Quality assurance - testing
  title: Autopkgtests
  mode: deterministic
  evaluator: autopkgtests
  readiness: warning
  adapters_required: [autopkgtest-db]
  template: 'TODO: - Autopkgtest presence and results: TBD'
- id: REP-QA-TEST-003
  section: Quality assurance - testing
  title: Testing gaps and plan
  mode: human_only
  readiness: blocker
  required: false
  question:
    kind: multiline
    prompt: If there are any known testing gaps, hardware/manual test plan, execution frequency, or regression consequences worth noting, explain them.
  template: 'TODO: - Testing gaps and the owning team test plan are: TBD'
- id: REP-QA-TEST-005
  section: Quality assurance - testing
  title: Non-automated testing access
  mode: human_only
  readiness: blocker
  applicability:
    any:
    - item: REP-QA-MAINT-004
      equals: team-access
    - evidence: autopkgtest-db.has_autopkgtest
      equals: false
    - evidence: autopkgtest-db.failing_arches
      truthy: true
  question:
    kind: single_choice
    prompt: Select the concrete way the owning team can test cases not covered by build tests or autopkgtests.
    options:
    - id: A-team-hardware
      label: Hardware is available in the team
      statement: '- The owning team has access to the required hardware.'
    - id: B-budget
      label: Budget is allocated to acquire hardware
      statement: '- Budget is allocated to acquire the required hardware, but it is not available yet.'
    - id: C-testflinger
      label: Solutions QA hardware through Testflinger
      statement: '- Solutions QA hardware will be used through Testflinger.'
    - id: D-other-team
      label: Hardware from another team
      statement: '- Another team will provide access to the required hardware.'
    - id: E-simulator
      label: A sufficiently representative simulator
      statement: '- A simulator will provide sufficiently representative test coverage.'
    - id: F-upstream
      label: Upstream community tests new builds
      statement: '- The upstream community can test new Ubuntu package builds.'
    - id: G-users
      label: User community tests new builds
      statement: '- The user community can test new Ubuntu package builds.'
    - id: H-manufacturer
      label: Hardware manufacturer tests new builds
      statement: '- The hardware manufacturer has agreed to test new builds.'
    - id: X-exhausted
      label: All feasible testing options are exhausted
      statement: '- All feasible ways to test or recreate this case have been exhausted; the owning team accepts the additional servicing and regression risk.'
    - id: Z-other
      label: Something else / a special situation (describe below)
      statement: '- A different, situation-specific arrangement provides non-automated testing access; see the test plan details below.'
    - id: Y-build-autopkgtest
      label: Build and Autopkgtest can cover all regular tests this package needs
      statement: '- Build and Autopkgtest can cover all regular tests this package needs.'
  template: 'TODO-A-H/X: - Non-automated testing access: TBD'
- id: REP-QA-TEST-006
  section: Quality assurance - testing
  title: Non-automated test plan details
  mode: human_only
  readiness: blocker
  applicability:
    item: REP-QA-TEST-005
    in:
    - A-team-hardware
    - B-budget
    - C-testflinger
    - D-other-team
    - E-simulator
    - F-upstream
    - G-users
    - H-manufacturer
    - X-exhausted
    - Z-other
  question:
    kind: multiline
    prompt: Provide the test plan or automation, example logs, execution frequency, and likely regression consequences.
  template: 'TODO: - Test plan, logs, frequency, and regression consequences: TBD'
- id: REP-QA-TEST-007
  section: Quality assurance - testing
  title: Failing autopkgtest explanation
  mode: human_only
  readiness: blocker
  applicability:
    evidence: autopkgtest-db.failing_arches
    truthy: true
  preface_evaluator: autopkgtests
  question:
    kind: multiline
    prompt: Explain every failing or ignored autopkgtest result and why it is acceptable.
  template: 'TODO: - Failing or ignored autopkgtests are acceptable because TBD'
- id: REP-QA-TEST-008
  section: Quality assurance - testing
  title: Micro-library solution-level testing
  mode: human_only
  readiness: warning
  required: false
  applicability:
    evidence: packaging-source.is_library_package
    equals: true
  adapters_required: [packaging-source]
  question:
    kind: multiline
    prompt: If this is a minimal library tested in a wider solution, identify that solution and its end-to-end tests.
  template: 'TODO: - Minimal-library solution-level testing context: TBD'
- id: REP-QA-TEST-004
  section: Quality assurance - testing
  title: Test adequacy assessment
  mode: ev_to_ai
  readiness: blocker
  adapters_required: [fetch-build, packaging-source, autopkgtest-db]
  adapters_optional: [consumer-autopkgtests]
  autopkgtest_log_followup: true
  ai_policy: Assess whether observed build tests and autopkgtests are non-trivial and plausibly cover regressions. The actual autopkgtest test definitions are provided in full in packaging-source.debian_tests_control (debian/tests/control) - read them to judge non-triviality (e.g. a real functional test vs. only invoking --help/--version) before concluding the evidence is inconclusive; autopkgtest-db only reports pass/fail per architecture, not what the tests do. If fetch-build.build_log is empty or unavailable, do not treat that alone as inconclusive - packaging-source.debian_rules_overrides and the full debian/rules text are provided specifically to let you state confidently whether the default dh_auto_test target is disabled/overridden or left to run unmodified, even without the log itself. Surface gaps; never invent test execution or a team commitment.
  question:
    kind: multiline
    prompt: Assess whether test coverage is adequate and explain how remaining gaps will be covered.
  template: 'TODO: - Overall automated and end-to-end test adequacy: TBD'
- id: REP-QA-PKG-001
  section: Quality assurance - packaging
  title: Upstream update mechanism
  mode: deterministic
  evaluator: watch-file
  readiness: warning
  adapters_required: [packaging-source]
  template: 'TODO: - A mechanism to detect and fetch upstream versions is present or explained: TBD'
- id: REP-QA-PKG-002
  section: Quality assurance - packaging

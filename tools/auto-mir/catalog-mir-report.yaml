  question:
    kind: single_choice
    prompt: Does this package ship a standard-conformant desktop file?
    options:
    - id: has-desktop-file
      label: Yes, it ships a standard-conformant desktop file
      statement: '- This package ships a standard-conformant desktop file.'
      readiness: clear
      todo_ref: 'TODO-A: - End-user applications that ships a standard conformant desktop file, see TBD'
    - id: missing-desktop-file
      label: No, it does not ship a desktop file
      statement: '- This package is end-user facing but does not ship a desktop file.'
      readiness: warning
      todo_ref: 'TODO-B: - End-user applications without desktop file, not needed because TBD'
  template: "TODO-A: - End-user applications that ships a standard conformant desktop file,\nTODO-A:   see TBD\nTODO-B: - End-user applications without desktop file, not needed because TBD"

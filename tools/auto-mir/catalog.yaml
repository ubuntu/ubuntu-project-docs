# ==========================================================================
# Common blockers
# ==========================================================================
- id: CB-1
  section: Common blockers
  title: Does not FTBFS currently
  mode: deterministic
  blocker_class: hard
  adapters_required:
  - sbuild
  - lp-build-api
  messages:
    hint_local_ok: local sbuild build succeeded
    hint_local_failed: local sbuild build FAILED (see build log)
    hint_local_unavailable: local sbuild result unavailable
    unknown_no_lp_message: 'Could not confirm Launchpad build state ({local_hint})'
    unknown_no_lp_todo: 'TODO: - does not FTBFS currently ({local_hint}; verify recent Launchpad build records)'
    unknown_no_builds_message: 'No Launchpad build records were found ({local_hint})'
    unknown_no_builds_todo: 'TODO: - does not FTBFS currently ({local_hint}; no Launchpad build records to confirm)'
    not_ok_message: 'Launchpad build state shows failures: {failed_builds}'
    not_ok_todo: 'TODO: - does not FTBFS currently'
    ok_message: 'does not FTBFS currently; Launchpad build records pass for arches: {passing_arches}'
    ok_local_suffix: '; local sbuild build also succeeded'
  negated_statement: does FTBFS currently
  todo_refs:
  - 'TODO: - does not FTBFS currently'
  ai_policy: none
  notes: 'sbuild is one signal. Also check Launchpad multi-architecture build state via API for all architectures the package targets. All must pass.'
- id: CB-2
  section: Common blockers
  title: Build-time test suite exists and fails build on error
  mode: ev_to_ai
  blocker_class: hard
  adapters_required:
  - sbuild
  - packaging-source
  messages:
    llm_unavailable_message: 'LLM unavailable: {error}'
  todo_refs:
  - 'TODO: - does have a test suite that runs at build time'
  - 'TODO:   - test suite fails will fail the build upon error.'
  ai_policy: 'Determine whether a build-time test suite exists and whether its failure fails the build. Use the build_test_hints evidence (extracted from debian/rules and the build log: dh_auto_test wiring, override_dh_auto_test, DEB_BUILD_OPTIONS nocheck, make check/test, pytest/meson test/ctest invocations, and test pass/fail lines in the build log) together with the build log itself. Outcomes: (1) a test suite runs at build time and failures gate the build -> ok; (2) the suite exists but failures are ignored (e.g. test errors swallowed) -> required, ask to wire failures to fail the build; (3) no build-time test suite at all -> required, BUT first check the reporter MIR content: if the reporter explained the absence (e.g. upstream provides no test suite), include that explanation in the message so the reviewer can decide whether to accept it rather than presenting it as an unexplained gap; (4) genuinely cannot tell from the evidence -> low confidence so it is left for the reviewer to decide. Do not emit the raw template TODO verbatim; produce a decisive characterisation.'

- id: CB-3
  section: Common blockers
  title: Non-trivial autopkgtest exists
  mode: ev_to_ai
  blocker_class: hard
  adapters_required:
  - packaging-source
  - autopkgtest-db
  messages:
    llm_unavailable_message: 'LLM unavailable: {error}'
  todo_refs:
  - 'TODO: - does have a non-trivial test suite that runs as autopkgtest'
  ai_policy: 'Decide whether a non-trivial autopkgtest exists and runs. Two evidence sources answer two different questions and BOTH must be weighed; do not conclude a test is missing from only one of them. (1) autopkgtest-db is AUTHORITATIVE for whether tests actually run and pass in the Ubuntu autopkgtest infrastructure: when has_autopkgtest is true and passing_arches is non-empty (with failing_arches empty), tests demonstrably exist and pass — treat this as strong, high-confidence evidence and resolve status ok even if debian/tests/control was not captured (e.g. it was only added in a pocket that was not analysed). Results may come from a fallback release; mention that in the message. (2) packaging-source.debian_tests_control shows whether autopkgtests are DECLARED and what they exercise: a real functional test (e.g. decoding/encoding sample files, exercising the shared library) is non-trivial; a bare import/version/smoke check is not. When debian/tests/control declares a real functional test, name it in the message. Resolution: if the DB shows tests passing, or debian/tests/control declares a non-trivial functional test (or both), resolve ok with the template statement and cite the evidence used. Emit a required TODO ONLY when there is genuinely no autopkgtest (DB shows none AND no debian/tests/control) or the only test is trivial. Never report a missing test suite while the DB shows passing autopkgtests. Reviewer override available.'

- id: CB-4
  section: Common blockers
  title: 'Special hardware: requirement and coverage plan'
  mode: ev_to_ai
  blocker_class: none
  adapters_required:
  - packaging-source
  messages:
    llm_unavailable_message: 'LLM unavailable: {error}'
  todo_refs:
  - 'TODO-A: - This does seem to need special HW for build or test...'
  - 'TODO-B: - This does not need special HW for build or test'
  - 'TODO-C: - This does need special HW for thorough testing, but all options... have been exhausted'
  options:
  - id: CB-4-A
    todo_ref: TODO-A
    predicate: special HW needed and one coverage alternative documented
    render: '- This does seem to need special HW for build or test; the requester documented a coverage plan (see [Quality assurance - testing])'
    outcome: recommended
  - id: CB-4-B
    todo_ref: TODO-B
    predicate: no special HW needed
    render: '- This does not need special HW for build or test'
    outcome: ok
  - id: CB-4-C
    todo_ref: TODO-C
    predicate: special HW needed; all options exhausted; human must confirm
    render: '- This does need special HW for thorough testing, but all options to get this covered have been exhausted and it is accepted as-is as a compromise'
    outcome: required
  ai_policy: 'Detect whether special hardware is needed from reporter content and test metadata. Default to CB-4-B (no special HW needed) unless there is positive evidence that exotic/dedicated hardware is required to build or test the package. For cases that require it, check whether one of the accepted alternatives is present in the reporter content (testflinger, partner, simulator, community, manufacturer, solutions-qa, or other team). Surface evidence. Reviewer makes final judgment on whether options are truly exhausted for TODO-C.'

- id: CB-5
  section: Common blockers
  title: Special hardware compromise accepted
  mode: deterministic
  blocker_class: soft
  adapters_required:
  - lp-bug-api
  messages:
    ok_message: no special hardware needed, so there is no compromise to accept
    human_only_message: Human review required
    human_only_todo: 'TODO: - {title} - reviewer judgment needed'
  todo_refs:
  - 'TODO-C: accepted as-is as a compromise'
  ai_policy: none
  notes: 'This only becomes a judgment call when special hardware is actually needed. It is gated on CB-4: when CB-4 concludes no special hardware is required, there is no compromise to accept and this resolves ok. Otherwise the tool surfaces the reporter justification and the reviewer decides whether "all options have been exhausted" meets the bar.'
- id: CB-6
  section: Common blockers
  title: E2E coverage for simple libs via consumers
  mode: ev_to_ai
  blocker_class: none
  adapters_required:
  - dep-analysis
  - autopkgtest-db
  adapters_optional:
  - lp-package-api
  messages:
    llm_unavailable_message: 'LLM unavailable: {error}'
  todo_refs:
  - 'TODO: - if a non-trivial test on this level does not make sense..., is the overall solution (app+libs) extensively covered i.e. via end to end autopkgtest ?'
  ai_policy: 'Attempt to pull reverse-dep autopkgtest status and summarise whether key consumers have non-trivial tests covering the lib''s functionality. Weight by importance of consumer. On retrieval failure, fall back to human-only TODO.'

- id: CB-7
  section: Common blockers
  title: No new Python 2 dependency
  mode: deterministic
  blocker_class: hard
  security_trigger: null
  adapters_required:
  - dep-analysis
  - packaging-source
  messages:
    ok_message: no new python2 dependency
    unknown_message: Could not analyse Python2 dependencies
    blocker_message: 'Python2 dependency found ({dep}) — hard blocker'
    blocker_todo: 'TODO: - python2 dependency must be removed or ported before main inclusion'
  todo_refs:
  - 'TODO: - no new python2 dependency'
  ai_policy: none
- id: CB-8
  section: Common blockers
  title: 'Python: uses dh_python'
  mode: deterministic
  language_gate: python
  blocker_class: hard
  adapters_required:
  - packaging-source
  messages:
    unknown_message: Could not inspect debian/rules (packaging-source failed)
    unknown_todo: 'TODO: - Check debian/rules for dh_python'
    ok_not_python_message: not a Python package; Python packaging constraints do not apply
    ok_message: Python package, but using dh_python
    not_ok_message: Python package detected but dh_python/dh_python3 not found in debian/rules
    not_ok_todo: 'TODO: - Python packages must use dh_python'
  todo_refs:
  - 'TODO: - Python package, but using dh_python'
  ai_policy: none
- id: CB-9
  section: Common blockers
  title: 'Go: uses dh-golang'
  mode: ev_to_ai
  language_gate: go
  blocker_class: soft
  adapters_required:
  - packaging-source
  messages:
    llm_unavailable_message: 'LLM unavailable: {error}'
  todo_refs:
  - 'TODO: - Go package, but using dh-golang'
  ai_policy: 'Ubuntu rules for Go packaging may differ from Debian guidance. MIR docs are authoritative. Check for dh-golang; if absent, suggest dh-make-golang. Often a recommendation rather than a hard requirement.'


    render: '- This is an Ubuntu-only package'
    outcome: ok
  ai_policy: 'Decide which option applies using the git-ubuntu-delta adapter evidence (delta_kind, delta_present, delta_category, diffstat, delta_summary). If delta_kind is "sync" (delta_present false) choose option A: Ubuntu does not carry a delta. If delta_kind is "native" or the package exists only in Ubuntu choose option C: Ubuntu-only package. If delta_kind is "ubuntu_delta" choose option B: the following delta categories are considered reasonable and maintenance-under-control and MUST resolve to ok without escalation: (1) delta_category "tests-only" (the delta only adds or changes tests, e.g. only debian/tests paths in the diffstat); (2) delta fully upstreamed to Debian and/or upstream and expected to drop on the next merge. For option B always include in the message a one-line summary of what the delta actually changes (from delta_summary/diffstat) so the reviewer can judge quickly. Escalate to required/NACK only when the diffstat shows a large unjustified delta AND there is no explanation AND no active minimisation in progress. Do NOT ask anyone to "provide git-ubuntu log and diff" and do NOT invent TODO-A/TODO-B placeholders: the git-ubuntu-delta adapter already supplies the diff; decide from it.'

- id: PRF-2
  section: Packaging red flags
  title: Symbols tracking for C/C++ libraries
  mode: deterministic
  blocker_class: none
  adapters_required:
  - packaging-source
  - sbuild
  messages:
    unknown_message: Could not inspect packaging (packaging-source failed)
    unknown_todo: 'TODO: - Check for symbols file'
    ok_message: symbols tracking is in place
    ok_no_shared_message: symbols tracking not applicable for this kind of code
    not_ok_message: Shared library is shipped but no debian/*.symbols file was found
    not_ok_todo: 'TODO: - symbols tracking isn''t in place; add a debian/*.symbols file (or, for C++ libraries, document why tracking is impractical)'
  todo_refs:
  - 'TODO-A: - symbols tracking is in place.'
  - 'TODO-B: - For c++ libraries - symbols tracking isn''t in place but the owning team tried...'
  - 'TODO-C: - symbols tracking not applicable for this kind of code.'
  - 'TODO-D: - symbols tracking not applicable for this kind of code because it the shared objects are only used internally...'
  options:
  - id: PRF-2-A
    todo_ref: TODO-A
    predicate: C/C++ library with symbols file present and maintained
    render: '- symbols tracking is in place.'
  - id: PRF-2-B
    todo_ref: TODO-B
    predicate: C++ library; symbols tracking impractical; alternatives considered
    render: '- For c++ libraries - symbols tracking isn''t in place but the owning team tried to set it up...'
  - id: PRF-2-C
    todo_ref: TODO-C
    predicate: symbols tracking not applicable for this language/runtime
    render: '- symbols tracking not applicable for this kind of code.'
  - id: PRF-2-D
    todo_ref: TODO-D
    predicate: internal-only .so, no external headers
    render: '- symbols tracking not applicable for this kind of code because the shared objects are only used internally and no headers are made available.'
  ai_policy: none
  notes: 'Language-aware N/A handling required. Some languages (Python, Go, Rust) do not have symbols files. Internal-only .so files with no external headers are also N/A. Reviewer keeps only the matching TODO-A/B/C/D option and may extend with rationale.'
- id: PRF-3
  section: Packaging red flags
  title: debian/watch present
  mode: deterministic
  blocker_class: none
  adapters_required:

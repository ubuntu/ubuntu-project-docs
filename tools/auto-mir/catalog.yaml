- id: URF-8
  section: Upstream red flags
  title: UI/desktop file check
  mode: ev_to_ai
  blocker_class: none
  adapters_required:
  - packaging-source
  - dep-analysis
  messages:
    llm_unavailable_message: 'LLM unavailable: {error}'
  todo_refs:
  - 'TODO-A: - not part of the UI for extra checks'
  - 'TODO-B: - part of the UI, desktop file is ok'
  options:
  - id: URF-8-A
    todo_ref: TODO-A
    predicate: not a user-facing graphical desktop program (library, CLI tool, daemon, -dev/-doc/-debug)
    render: '- not part of the UI for extra checks'
    outcome: ok
  - id: URF-8-B
    todo_ref: TODO-B
    predicate: user-facing desktop program that ships a valid .desktop file
    render: '- part of the UI, desktop file is ok'
    outcome: ok
  - id: URF-8-C
    todo_ref: TODO-B
    predicate: user-facing desktop program that does NOT ship a .desktop file
    render: '- part of the UI but no valid .desktop file is shipped'
    outcome: required
  ai_policy: 'Judge whether this package is a user-facing graphical desktop program (the kind an end user launches from a desktop menu). Base the judgement on binary_sections (libs/libdevel/doc/debug strongly indicate NOT a desktop program), runtime dependencies (GUI toolkits such as gtk, qt, libadwaita, gnome, kde, wxwidgets indicate a desktop app; their absence together with a library/CLI/daemon nature indicates not-UI), the package description, and general knowledge of the package. Do NOT use the presence or absence of a .desktop file to decide whether it IS a UI program (a desktop app missing its .desktop file is exactly what must be caught). Decision: if it is NOT a user-facing desktop program, select URF-8-A (the easy way out; the extra UI checks do not apply). If it IS a desktop program, verify with the has_desktop_file fact: ships one -> URF-8-B; does not -> URF-8-C.'

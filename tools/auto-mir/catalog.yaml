    not_ok_many_message: 'Lintian found {count} warnings - review and fix if possible'
    not_ok_many_todo: 'TODO: - Review and fix lintian warnings'
    minor_message: 'Lintian found {count} minor warnings - acceptable'
    minor_todo: 'TODO: - {count} minor lintian warnings documented'
    ok_message: no excessive lintian warnings
  todo_refs:
  - 'TODO: - no massive Lintian warnings'
  ai_policy: none
- id: PRF-9
  section: Packaging red flags
  title: debian/rules cleanliness
  mode: ev_to_ai
  blocker_class: none
  adapters_required:
  - packaging-source
  messages:
    llm_unavailable_message: 'LLM unavailable: {error}'
  todo_refs:
  - 'TODO: - debian/rules is rather clean'
  ai_policy: 'Assess debian/rules complexity from its full content (provided verbatim). Treat as clean (status ok, use the template statement) when it is essentially a base debhelper setup: a "#!/usr/bin/make -f" + "%: dh $@" style rules file with only defaults, or with overrides that merely configure/parametrise the build or the autotests/autoconfigure (e.g. passing flags, enabling/selecting tests) WITHOUT disabling them. Escalate to a reviewer judgment (recommended) only when the rules file is a maintenance hazard: it disables hardening or tests, contains large hand-rolled build logic, manipulates files in fragile ways, or is long/complex (roughly >100 non-comment lines). When escalating, summarise concisely what makes it complex so the reviewer can judge quickly. Controlling but not disabling autotests/autoconfigure is fine and stays ok.'

- id: PRF-10
  section: Packaging red flags
  title: Not on lto-disabled list
  mode: deterministic
  blocker_class: hard
  adapters_required:
  - lto-disabled-list
  messages:
    ok_message: It is not on the lto-disabled list
    not_ok_message: 'Package is on the lto-disabled list (architectures: {arches}); LTO must be fixed or disabled in the package before promotion'
    not_ok_todo: 'TODO: - Package is on the lto-disabled list ({arches}); ensure the LTO fix or in-package workaround is present before promotion (see https://launchpad.net/ubuntu/+source/lto-disabled-list)'
    unknown_message: Could not retrieve the lto-disabled-list (adapter failed)
    unknown_todo: 'TODO: - Manually verify the package is not on lp:ubuntu/+source/lto-disabled-list'
  todo_refs:
  - 'TODO: - It is not on the lto-disabled list'
  ai_policy: none
  notes: 'Check against lp:ubuntu/+source/lto-disabled-list. If present, the fix or workaround must be in the package itself before promotion.'

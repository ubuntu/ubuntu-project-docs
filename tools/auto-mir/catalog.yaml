  output_contract:
    build_log: str
    build_success: bool
    built_debs: list
    lintian_output: str
    lintian_warnings: list
    lintian_errors: list
    lintian_pedantic: list
    static_link_hints: list
  fallback: emit_todo_continue
  notes: Uses sbuild unshare backend (requires Noble or newer); installed from noble-backports when target is Noble
  notes: Uses sbuild unshare backend (requires Noble or newer); installed from noble-backports when target is Noble

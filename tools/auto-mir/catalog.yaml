# ============================================================================
# MIR Review Catalog - Canonical source of truth for automated MIR checks
# ============================================================================
# This file defines all checks performed during MIR (Main Inclusion Review).
# It serves as both runtime configuration and documentation template source.
#
# Structure:
#   metadata:              Policy references and template blueprint
#   global_policies:       Severity/confidence models and blocking rules
#   tooling_bootstrap:     Container setup and tool dependencies
#   evidence_adapters:     Data collection interfaces (APIs, tools, scripts)
#   checks:                Individual check definitions with evaluation rules
#
# ============================================================================

metadata:
  policy_authority: Ubuntu MIR policy (docs/MIR/) overrides Debian policy where they conflict
  policy_files:
  - path: docs/MIR/mir-reviewers-template.md
    role: generated render target for reviewer template
  - path: docs/MIR/mir-reporters-template.md
    role: reporter-content structure for intake gate
  - path: docs/MIR/mir-how-to-use-templates.md
    role: TODO/RULE semantics and reviewer posting workflow
  - path: docs/MIR/mir-rust.md
    role: Rust and Go language-specific policy
  - path: docs/MIR/main-inclusion-review.md
    role: MIR policy framing and terminology
  reviewer_template_source: catalog-blueprint
  external_policy_refs:
  - url: https://www.debian.org/doc/debian-policy/
    role: secondary packaging best-practice baseline
  - url: https://go-team.pages.debian.net/packaging.html
    role: Debian Go packaging guidelines (Ubuntu rules take precedence)
  review_template_blueprint:
  - (mir-reviewers-template)=
  - '# MIR reviewer''s template'

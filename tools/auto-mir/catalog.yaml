security_triggers:
- id: SEC-1-CVE-SYNTH
  title: CVE history risk synthesis
  linked_checks:
  - SEC-1
  trigger_condition: CVE data present from ubuntu-cve-tracker or nvd-enrich for this package
  synthesis: required
  synthesis_policy: 'AI synthesises risk across both trackers. Assess: total volume, severity classes, fix timeliness, systemic patterns. Weigh current and historical/predecessor CVEs (nvd-enrich historical_cves) separately: historical findings from upstream or older versioned names can raise the risk band and trigger a security review but must be clearly labelled historical and never block the current version. Output 3-band confidence (low/medium/high).

    '
  human_confirmation_required: true
  action: 'Emit structured security_trigger field in report with risk band and summary. May trigger security review assignment (SUM-6).

    '
  output_flags:
    structured_field: security_trigger
    summary_line: true
    blocks_ack: false
- id: SEC-3-WEBKIT
  title: webkit1/2 direct dependency
  linked_checks:
  - SEC-3
  trigger_condition: webkit1 or webkit2 found in runtime dependency list
  synthesis: none
  human_confirmation_required: false
  action: Emit required TODO; block ACK suggestion
  output_flags:
    structured_field: hard_blocker
    summary_line: true
    blocks_ack: true
- id: SEC-4-V8
  title: Direct lib*v8 dependency
  linked_checks:
  - SEC-4
  trigger_condition: lib*v8 found in runtime dependency list
  synthesis: none
  human_confirmation_required: false
  action: Emit required TODO; block ACK suggestion
  output_flags:
    structured_field: hard_blocker
    summary_line: true
    blocks_ack: true
- id: SEC-11-ATTESTATION
  title: Secure boot / TPM / signature involvement
  linked_checks:
  - SEC-11
  trigger_condition: secure boot, TPM, or signature handling detected in source or deps
  synthesis: ev_to_ai
  human_confirmation_required: false
  action: Mandatory security review path; no recommended-only outcome
  output_flags:
    structured_field: security_review_required
    summary_line: true
    blocks_ack: false
- id: SEC-13-MITIGATION-GAPS
  title: Risk mitigation gap assessment
  linked_checks:
  - SEC-13
  trigger_condition: exposure-level assessment from SEC-1 through SEC-12 is non-trivial
  synthesis: ev_to_ai
  human_confirmation_required: true
  action: 'Surface mitigations present and absent. Human reviewer determines severity (ok / recommended / required) based on proportionality judgment.

    '
  output_flags:
    structured_field: mitigation_assessment
    summary_line: true
    blocks_ack: false
render_policy:
  template_mode: template_close
  allow_rationale_append: true
  rationale_max_sentences: 2
  forbidden_line_prefixes:
  - 'RULE:'
  - 'RULE '
  todo_prefix_rule: 'Unresolved reviewer actions must begin with ''TODO:''. Resolved statements must not begin with ''TODO''.

    '
  option_pruning: 'For mutually exclusive TODO-A/B/C/D variants, emit only the single most applicable option based on evidence. Remove all others.

    '
  conformance_check: 'Before emitting final output, run line-linter to verify: no RULE lines remain, all unresolved items start with TODO, all resolved items have the TODO prefix removed.

    '
fallback_policy:
  on_adapter_error:
    action: emit_todo_continue
    behavior: 'When a deterministic evidence adapter fails (API unavailable, tool error, etc.): emit an explicit reviewer TODO noting the evidence gap, mark the finding unknown with confidence=low, include the retrieval failure reason, and continue the run. Never silently infer from missing data.

      '
  on_missing_optional_data:
    action: continue_without
    behavior: 'Optional adapters that fail are noted in report metadata but do not block the run or affect severity of other checks.

      '
  on_missing_required_data:
    action: emit_todo_fail_gracefully
    behavior: 'Required data that cannot be collected causes that check''s finding to be unknown/low-confidence with an explicit reviewer TODO. The run continues unless the missing data is the reporter MIR content (which causes a hard stop).

      '

  depends_on:
  - packaging-source
  - sbuild
  output_contract:
    runtime_deps: list
    deps_not_in_main: list
    dev_debug_doc_packages: list
    dep_source_map: list
    in_scope_deps_not_in_main: list
    out_of_scope_deps_not_in_main: list

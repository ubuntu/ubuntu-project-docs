# ============================================================================
# Global Policies - Severity, confidence, and blocking rules
# ============================================================================
# These policies apply across all checks and define the decision framework.
# ============================================================================

global_policies:
  # Severity levels indicate impact on MIR approval
  # - ok:          No issues found
  # - recommended: Best practice, should address but not blocking
  # - required:    Must resolve before MIR approval
  # - nack:        Automatic rejection (e.g., missing reporter content)
  severity_model:
    levels:
    - ok
    - recommended
    - required
    - nack
    description: 'Severity is determined by findings, not pre-assigned to TODO lines. A check may resolve to any level depending on what the evidence shows.

      '
  # Confidence bands indicate evidence strength
  # - low:    Insufficient evidence, needs manual review
  # - medium: Reasonable evidence, human should verify
  # - high:   Strong evidence from deterministic checks
  # Note: AI-only findings are capped at medium confidence
  confidence_model:
    bands:
    - low
    - medium
    - high
    description: 'Confidence reflects how strongly the evidence supports the finding. AI-derived findings cap at medium unless corroborated by deterministic evidence.

      '
  # Rules that block MIR approval (ACK)
  # - required severity: Must resolve before approval
  # - hard_blocker: Explicit blocking condition
  # - NACK-eligible: Fundamental issues requiring rejection
  # Rules that block MIR approval (ACK)
  # - required severity: Must resolve before approval
  # - hard_blocker: Explicit blocking condition
  # - NACK-eligible: Fundamental issues requiring rejection
  ack_block_rules:
  - any finding with severity "required" blocks ACK suggestion
  - any active hard_blocker finding blocks ACK suggestion
  - NACK-eligible findings are explicitly marked per check
  nack_conditions:
  - id: reporter-mir-content-missing
    description: Reporter MIR content not found in bug; hard stop before any checks run
  - id: SEC-3-WEBKIT
    description: Direct webkit1/2 dependency found
  - id: SEC-4-V8
    description: Direct libv8 dependency found
  - id: CB-7-PYTHON2
    description: New python2 dependency introduced
tooling_bootstrap:
  mode_default: latest-branch
  mode_override_flag: --pin-tooling
  description: 'Default: clone upstream tools at HEAD of default branch each run for freshness. Override: --pin-tooling <commit> for reproducible benchmark or replay runs.

    '
  upstream_sources:
  - id: ubuntu-archive-tools
    repo: https://git.launchpad.net/ubuntu-archive-tools
    required_scripts:
    - component-mismatches
    prerequisites:
    - germinate
  - id: ubuntu-dev-tools
    apt_package: ubuntu-dev-tools
    provides:
    - seeded-in-ubuntu
  required_in_container:
  - sbuild
  - lintian
  - git-ubuntu
  - ubuntu-dev-tools
  - dpkg-dev
  - apt-utils
  - python3-launchpadlib

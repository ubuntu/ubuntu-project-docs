# ============================================================================
# MIR Shared Catalog - Confidence model and evidence adapters shared by both
# the reviewer and reporter roles
# ============================================================================
# This file holds only the small set of definitions inherited by both role
# catalogs. Keep it small: only add a section here if it is genuinely shared
# by both reviewer and reporter mode.
#
# Reviewer-only content (checks, reviewer-template blueprint, render/fallback
# policy) lives in catalog-mir-review.yaml. Reporter-only content (items,
# reporter-template blueprint) lives in catalog-mir-report.yaml. Load either
# role's composed view with catalog.load_catalog_for_role().
#
# Structure:
#   global_policies:    Confidence model shared across checks
#   evidence_adapters:   Data collection interfaces (APIs, tools, scripts)
#
# ============================================================================

# ============================================================================
# Global Policies - Severity, confidence, and blocking rules
# ============================================================================
# These policies apply across all checks and define the decision framework.
# ============================================================================

global_policies:
  # Confidence bands indicate evidence strength
  # - low:    Insufficient evidence, needs manual review
  # - medium: Reasonable evidence, human should verify
  # - high:   Strong evidence from deterministic checks
  # AI findings may use all three bands but always require human confirmation.
  confidence_model:
    bands:
    - low
    - medium
    - high
    description: 'Confidence reflects how strongly the evidence supports the finding. AI-derived findings may reach high confidence for clear evidence, but always require human confirmation.'
evidence_adapters:
- id: lp-bug-api
  type: api
  description: Fetch Launchpad bug metadata, description, comments, and target package
  inputs:
  - bug_id
  output_contract:
    bug_title: str
    bug_description: str
    bug_comments: list
    target_source_package: str
    target_series: str
    bug_tags: list
    bug_subscribers: list
  fallback: hard_fail
  notes: No web scraping; Launchpad API only
- id: lp-package-api
  type: api
  description: Fetch source package publishing history for Ubuntu and Debian via LP API
  inputs:
  - source_package
  - series
  output_contract:
    ubuntu_publish_history: list
    debian_publish_history: list
    current_version: str
    upload_history: list
    uploaders: list
  fallback: emit_todo_continue
- id: lp-build-api
  type: api
  description: Fetch per-architecture build state from Launchpad, pinned to the exact version packaging-source analysed
  inputs:
  - source_package
  - series
  depends_on:
  - packaging-source
  output_contract:
    builds: list
  fallback: emit_todo_continue
- id: lp-bug-search-api
  type: api
  description: Search Ubuntu package bug space on Launchpad for open/critical bugs
  inputs:
  - source_package
  output_contract:
    open_bugs: list
    critical_bugs: list
    security_bugs: list
  fallback: emit_todo_continue
- id: lp-mir-history
  type: api
  description: Search Launchpad for prior MIR bugs on this source or predecessor names
  inputs:
  - source_package
  output_contract:
    candidate_names: list
    prior_mir_bugs: list
  fallback: emit_todo_continue
  notes: Best-effort; informs review-type detection (renamed/reorganised sources)
- id: lp-team-membership-api
  type: api
  description: Check team membership and bug subscriber status via Launchpad API
  inputs:
  - team_name
  output_contract:
    members: list
    is_subscribed: bool
  fallback: emit_todo_continue
- id: team-mapping
  type: web
  description: Fetch package-team-mapping.json to check which teams have structural bug subscriptions to the source package
  inputs:
  - source_package
  output_contract:
    team_mapping: dict
    subscribed_teams: list
    source_package: str
  fallback: emit_todo_continue
  notes: Downloads from https://static-reports.ubuntu.com/package-team-mapping.json and filters out display-only teams
- id: lto-disabled-list
  type: web
  description: Fetch the lto-disabled-list to check whether the source package must not be built with LTO
  inputs:
  - source_package
  output_contract:
    on_list: bool
    disabled_arches: list
    source_package: str
  fallback: emit_todo_continue
  notes: Downloads from https://git.launchpad.net/ubuntu/+source/lto-disabled-list/plain/lto-disabled-list; a package listed for any architecture qualifies
- id: debian-bts
  type: web
  description: Fetch open bugs from Debian Bug Tracking System for the package
  inputs:
  - source_package
  output_contract:
    open_bugs: list
    rc_bugs: list
    security_bugs: list
  fallback: emit_todo_continue
- id: upstream-tracker
  type: heuristic
  description: Detect and query upstream project bug tracker and release history
  inputs:
  - source_package
  - upstream_url_hint
  output_contract:
    upstream_url: str
    open_issues_count: int
    recent_releases: list
    last_release_date: str
  fallback: emit_todo_continue
  notes: URL detection prefers debian/watch, then Homepage in debian/control, then package-name-based search; ignore Vcs-Git packaging repos
- id: sbuild
  type: local_exec
  description: Run sbuild with unshare backend in LXD VM; produces build log, lintian output, and built .deb files
  inputs:
  - source_package
  - series
  - architectures
  depends_on:
  - packaging-source
  output_contract:
    build_log: str
    build_success: bool
    built_debs: list
    lintian_output: str
    lintian_warnings: list
    lintian_errors: list
    lintian_pedantic: list
    static_link_hints: list
  fallback: emit_todo_continue
  notes: Uses sbuild unshare backend (requires Noble or newer); installed from noble-backports when target is Noble
- id: deb-metadata
  type: local_exec
  description: Extract Built-Using and Static-Built-Using metadata from built .deb files after sbuild
  inputs:
  - built_debs
  depends_on:
  - sbuild
  output_contract:
    status: str
    message: str
    deb_packages: list
  fallback: emit_todo_continue
- id: binary-package-inspection
  type: local_exec
  description: Expose security, service, UI, and maintenance facts from the single extraction of built binary packages
  inputs:
  - sbuild
  depends_on:
  - sbuild
  fallback: emit_todo_continue
- id: lintian
  type: local_exec
  description: Parse lintian output from sbuild run
  inputs:
  - sbuild_output
  depends_on:
  - sbuild
  output_contract:
    errors: list
    warnings: list
    pedantic: list
  fallback: emit_todo_continue
- id: packaging-source
  type: local_exec
  description: Fetch package source via git-ubuntu and analyse packaging files
  inputs:
  - source_package
  depends_on:
  - lp-package-api
  output_contract:
    debian_control: dict
    debian_rules: str
    debian_watch: str
    debian_copyright: str
    debian_tests_control: str
    service_files: list
    apparmor_profiles: list
    built_using_entries: list
    cargo_lock_present: bool
    go_sum_present: bool
    vendored_dirs: list
  fallback: emit_todo_continue
- id: dep-analysis
  type: local_exec
  description: Extract runtime dependencies from built .deb files, map to source packages, and filter by MIR scope
  inputs:
  - binary_packages
  - series
  - requested_binaries
  depends_on:
  - packaging-source
  - sbuild
  output_contract:
    runtime_deps: list
    deps_not_in_main: list
    dev_debug_doc_packages: list
    dep_source_map: list
    in_scope_deps_not_in_main: list
    out_of_scope_deps_not_in_main: list
    same_source_deps: list
    runtime_deps_in_main: list
  fallback: emit_todo_continue
  notes: Uses post-build dependencies from sbuild output; maps deps to source packages to identify same-source deps; runtime_deps_in_main lists in-scope runtime deps already in main (used by DEP-4)
- id: component-mismatches
  type: local_exec
  description: Run upstream ubuntu-archive-tools/component-mismatches to identify promotion candidates
  inputs:
  - source_package
  - series
  output_contract:
    promotion_candidates: list
    mismatch_report: str
  fallback: emit_todo_continue
  notes: Fetch and run original ubuntu-archive-tools script; no local reimplementation
- id: reverse-deps
  type: local_exec
  description: List reverse-dependency consumer source packages via reverse-depends (runtime and build-depends) against the target release
  inputs:
  - source_package
  - series
  output_contract:
    consumers: list
    consumer_sources: list
    release: str
  fallback: emit_todo_continue
  notes: Uses reverse-depends from ubuntu-dev-tools (already provisioned in the guest) against <codename>-proposed with fallback to the bare codename; maps reverse-dep binaries to their source packages so CB-6 can reason about end-to-end coverage via consumers
- id: ubuntu-upload-permission
  type: local_exec
  description: Run ubuntu-upload-permission --list-uploaders to determine who may upload the package
  inputs:
  - source_package
  output_contract:
    raw_output: str
    components: list
    team_uploaders: list
    individual_uploaders: list
  fallback: emit_todo_continue
  notes: From ubuntu-dev-tools; reveals whether only the MOTU team (universe) can upload (typical sync-from-Debian case) versus specific individuals/teams
- id: git-ubuntu-delta
  type: local_exec
  description: Classify the Ubuntu delta vs Debian and, when an Ubuntu revision exists, produce a git-ubuntu diffstat
  inputs:
  - source_package
  depends_on:
  - packaging-source
  output_contract:
    version: str
    delta_kind: str
    delta_present: bool
    diffstat: str
    delta_summary: str
  fallback: emit_todo_continue
  notes: A pure Debian sync (X-Y) carries no Ubuntu delta and git-ubuntu is not run; only ...ubuntuN versions trigger a best-effort git-ubuntu clone and diffstat
- id: autopkgtest-db
  type: web
  description: Query autopkgtest.ubuntu.com/static/autopkgtest.db for test results
  inputs:
  - source_package
  - series
  output_contract:
    test_results: list
    has_autopkgtest: bool
    passing_arches: list
    failing_arches: list
  fallback: emit_todo_continue
- id: consumer-autopkgtests
  type: web
  description: Look up autopkgtest status for each reverse-dependency consumer source in the (shared, cached) autopkgtest DB
  inputs:
  - series
  depends_on:
  - reverse-deps
  output_contract:
    consumers: list
  fallback: emit_todo_continue
  notes: Reuses the single per-run autopkgtest.db download shared with the autopkgtest-db adapter; reports per-consumer passing/failing arches so CB-6 can weigh end-to-end coverage via consumers
- id: dependency-autopkgtests
  type: web
  description: Look up autopkgtest status for each in-main runtime dependency's source in the (shared, cached) autopkgtest DB
  inputs:
  - series
  depends_on:
  - dep-analysis
  output_contract:
    dependency_coverage: list
  fallback: emit_todo_continue
  notes: Reuses the single per-run autopkgtest.db download shared with the autopkgtest-db adapter; reports per-dependency passing/failing arches so DEP-4 has grounded, structured evidence instead of needing to cross-reference dep-analysis and autopkgtest-db by hand
- id: dup-search
  type: local_exec
  description: Suggest possible duplicate/overlapping packages by deriving search terms from the package description (LLM) and probing the archive with apt-cache search, tagging each candidate's component
  inputs:
  - source_package
  depends_on:
  - packaging-source
  output_contract:
    search_terms: list
    candidates: list
  fallback: emit_todo_continue
  notes: Best-effort suggestions only; the reviewer (via RDO-1) decides whether any candidate is a genuine functional duplicate. Own binary packages are excluded from candidates.
- id: ubuntu-cve-tracker
  type: web
  description: Search Ubuntu CVE tracker for package-relevant CVEs
  inputs:
  - source_package
  output_contract:
    cves: list
    active_cves: list
    fixed_cves: list
  fallback: emit_todo_continue
- id: cve-search-terms
  type: heuristic
  description: Produce candidate CVE search terms (current package plus historical predecessors)
  inputs:
  - source_package
  output_contract:
    terms: list
  fallback: emit_todo_continue
- id: cvelist-scan
  type: local_exec
  description: Scan the cvelistV5 baseline corpus on the host to identify candidate CVEs
  inputs:
  - cve-search-terms
  depends_on:
  - cve-search-terms
  output_contract:
    candidates: list
    baseline: str
  fallback: emit_todo_continue
- id: nvd-enrich
  type: web
  description: Enrich scan candidates with normalized NVD severity, CWE and version ranges
  inputs:
  - cvelist-scan
  depends_on:
  - cvelist-scan
  output_contract:
    cves: list
    high_severity_cves: list
    historical_cves: list
  fallback: emit_todo_continue

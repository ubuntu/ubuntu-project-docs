- id: SEC-1
  section: Security
  title: CVE history assessment
  mode: ev_to_ai
  blocker_class: none
  security_trigger: SEC-1-CVE-SYNTH
  adapters_required:
  - ubuntu-cve-tracker
  - nvd-enrich
  messages:
    llm_unavailable_message: 'LLM unavailable: {error}'
  todo_refs:
  - 'TODO: - history of CVEs does not look concerning'
  ai_policy: 'AI risk synthesis across both trackers. Assess: volume of CVEs, severity classes, whether fixes are timely, patterns suggesting systemic issues. The nvd-enrich evidence tags each CVE as current or predecessor (historical_cves): predecessor/historical CVEs come from upstream or older versioned package names and inform severity. Clearly label historical findings as such; they may raise the recommendation to a security review but must never hard-block the current version. Output 3-band confidence (low/medium/high). Mandatory human confirmation for any non-trivial finding. Even historically patched but risk-significant patterns should surface as security-review-triggering.'


  ai_policy: none
- id: PRF-4
  section: Packaging red flags
  title: Upstream update history
  mode: ev_to_ai
  blocker_class: none
  adapters_required:
  - upstream-tracker
  - lp-package-api
  messages:
    llm_unavailable_message: 'LLM unavailable: {error}'
  todo_refs:
  - 'TODO: - Upstream update history is (good/slow/sporadic)'
  ai_policy: "Assess upstream release cadence from release history and upstream tracker. Intentional stability (slow because nothing changes) is typically just an explanatory statement \u2014 still ok. Dead or abandoned trajectory may reach NACK-level concern. Output a characterisation; reviewer decides framing."

- id: PRF-5
  section: Packaging red flags
  title: Debian/Ubuntu update history
  mode: ev_to_ai
  blocker_class: none
  adapters_required:
  - lp-package-api
  adapters_optional:
  - upstream-tracker
  messages:
    llm_unavailable_message: 'LLM unavailable: {error}'
  todo_refs:
  - 'TODO: - Debian/Ubuntu update history is (good/slow/sporadic)'
  ai_policy: 'Characterise the Debian/Ubuntu update history as good, slow or sporadic. The lp-package-api adapter provides a computed release_cadence object (descriptor good/slow/sporadic plus releases, span_days and avg_interval_days) derived from the cross-series publishing history in all_publish_history; treat that computed descriptor as the primary signal. Guidance for the descriptors: good means roughly one or more uploads per six months; slow means about one upload per year; sporadic means less frequent than that. Then compare against the upstream release cadence (upstream-tracker, when available): a slow distro cadence is acceptable and explanatory when upstream itself is stable/slow, but may warrant a recommendation when upstream is active and the distro is consistently behind. Do NOT ask for more data: decide from release_cadence even if it is the only signal, and only report unknown when release_cadence.descriptor is unknown. Output the chosen characterisation.'

- id: PRF-6
  section: Packaging red flags
  title: Current release packaged
  mode: deterministic
  blocker_class: none
  adapters_required:
  - lp-package-api
  - upstream-tracker
  messages:
    unknown_message: Could not determine package version information
    unknown_todo: 'TODO: - Verify packaged version against latest upstream release'
    ok_message: the current release is packaged
    very_behind_message: 'Package is very behind upstream: {archive} vs {upstream}'
    somewhat_behind_message: 'Package is somewhat behind upstream: {archive} vs {upstream}'
    behind_todo: 'TODO: - Consider updating to a more recent upstream release'
    version_lag_message: 'Package version lag detected: {archive} vs {upstream}'
    unknown_lag_message: Could not determine version lag
    version_lag_todo: 'TODO: - Verify upstream version availability'
  todo_refs:
  - 'TODO: - the current release is packaged'
  ai_policy: none
- id: PRF-7
  section: Packaging red flags
  title: Promoting does not harm MOTU maintainers
  mode: ev_to_ai
  blocker_class: none
  adapters_required:
  - lp-package-api
  - lp-team-membership-api
  adapters_optional:
  - ubuntu-upload-permission
  messages:
    llm_unavailable_message: 'LLM unavailable: {error}'
  todo_refs:
  - 'TODO: - promoting this does not seem to cause issues for MOTUs that so far maintained the package'
  ai_policy: 'Decide whether promoting this package to main would remove a current maintainer''s ability to upload it. Use ubuntu-upload-permission (components, team_uploaders, individual_uploaders) to see who may currently upload: a package uploadable only by the MOTU team in universe is the typical sync-from-Debian case. Cross-reference lp-package-api upload_history and uploaders: if the package is generally synced from Debian (versions without an ubuntuN delta), has no regular Ubuntu uploader, or its Ubuntu uploads come from people who are not MOTU-only (e.g. core-dev or specific package uploaders), then promotion does not harm MOTU maintainers (severity ok). Only flag (recommended/required) when a person who regularly uploads Ubuntu-specific changes is a MOTU member who would lose upload access after promotion. Do NOT request more data: decide from the provided evidence; core developers can always upload and are not listed by ubuntu-upload-permission.'


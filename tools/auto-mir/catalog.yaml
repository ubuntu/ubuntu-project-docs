# ============================================================================
# Global Policies - Severity, confidence, and blocking rules
# ============================================================================
# These policies apply across all checks and define the decision framework.
# ============================================================================

global_policies:
  # Confidence bands indicate evidence strength
  # - low:    Insufficient evidence, needs manual review
  # - medium: Reasonable evidence, human should verify
  # - high:   Strong evidence from deterministic checks
  # Note: AI-only findings are capped at medium confidence
  confidence_model:
    bands:
    - low
    - medium
    - high
    description: 'Confidence reflects how strongly the evidence supports the finding. AI-derived findings cap at medium unless corroborated by deterministic evidence.'
evidence_adapters:
- id: lp-bug-api
  type: api
  description: Fetch Launchpad bug metadata, description, comments, and target package
  inputs:
  - bug_id
  output_contract:
    bug_title: str
    bug_description: str
    bug_comments: list
    target_source_package: str
    target_series: str
    bug_tags: list
    bug_subscribers: list
  fallback: hard_fail
  notes: No web scraping; Launchpad API only
- id: lp-package-api
  type: api
  description: Fetch source package publishing history for Ubuntu and Debian via LP API
  inputs:
  - source_package
  - series
  output_contract:
    ubuntu_publish_history: list
    debian_publish_history: list
    current_version: str
    upload_history: list
    uploaders: list
  fallback: emit_todo_continue
- id: lp-build-api
  type: api
  description: Fetch per-architecture build state from Launchpad for the current package version
  inputs:
  - source_package
  - series
  output_contract:
    builds: list
  fallback: emit_todo_continue
- id: lp-bug-search-api
  type: api
  description: Search Ubuntu package bug space on Launchpad for open/critical bugs
  inputs:
  - source_package
  output_contract:
    open_bugs: list
    critical_bugs: list
    security_bugs: list
  fallback: emit_todo_continue
- id: lp-team-membership-api
  type: api
  description: Check team membership and bug subscriber status via Launchpad API
  inputs:
  - team_name
  output_contract:
    members: list
    is_subscribed: bool
  fallback: emit_todo_continue
- id: team-mapping
  type: web
  description: Fetch package-team-mapping.json to check which teams have structural bug subscriptions to the source package
  inputs:
  - source_package
  output_contract:
    team_mapping: dict
    subscribed_teams: list
    source_package: str
  fallback: emit_todo_continue
  notes: Downloads from https://static-reports.ubuntu.com/package-team-mapping.json and filters out display-only teams
- id: lto-disabled-list
  type: web
  description: Fetch the lto-disabled-list to check whether the source package must not be built with LTO
  inputs:
  - source_package
  output_contract:
    on_list: bool
    disabled_arches: list
    source_package: str
  fallback: emit_todo_continue
  notes: Downloads from https://git.launchpad.net/ubuntu/+source/lto-disabled-list/plain/lto-disabled-list; a package listed for any architecture qualifies
- id: debian-bts
  type: web
  description: Fetch open bugs from Debian Bug Tracking System for the package
  inputs:
  - source_package
  output_contract:
    open_bugs: list
    rc_bugs: list
    security_bugs: list
  fallback: emit_todo_continue
- id: upstream-tracker
  type: heuristic
  description: Detect and query upstream project bug tracker and release history
  inputs:
  - source_package
  - upstream_url_hint
  output_contract:
    upstream_url: str
    open_issues_count: int
    recent_releases: list
    last_release_date: str
  fallback: emit_todo_continue
  notes: URL detection prefers debian/watch, then Homepage in debian/control, then package-name-based search; ignore Vcs-Git packaging repos
- id: sbuild
  type: local_exec
  description: Run sbuild with unshare backend in LXD VM; produces build log, lintian output, and built .deb files
  inputs:
  - source_package
  - series
  - architectures
  depends_on:
  - packaging-source
  output_contract:
    build_log: str
    build_success: bool
    built_debs: list
    lintian_output: str
    lintian_warnings: list
    lintian_errors: list
    lintian_pedantic: list
    static_link_hints: list
  fallback: emit_todo_continue
  notes: Uses sbuild unshare backend (requires Noble or newer); installed from noble-backports when target is Noble
  notes: Uses sbuild unshare backend (requires Noble or newer); installed from noble-backports when target is Noble
- id: deb-metadata
  type: local_exec
  description: Extract Built-Using and Static-Built-Using metadata from built .deb files after sbuild
  inputs:
  - built_debs
  depends_on:
  - sbuild
  output_contract:
    status: str
    message: str
    deb_packages: list
  fallback: emit_todo_continue
- id: lintian
  type: local_exec
  description: Parse lintian output from sbuild run
  inputs:
  - sbuild_output
  output_contract:
    errors: list
    warnings: list
    pedantic: list
  fallback: emit_todo_continue
- id: packaging-source
  type: local_exec
  description: Fetch package source via git-ubuntu and analyse packaging files
  inputs:
  - source_package
  output_contract:
    debian_control: dict
    debian_rules: str
    debian_watch: str
    debian_copyright: str
    debian_tests_control: str
    service_files: list
    apparmor_profiles: list
    built_using_entries: list
    cargo_lock_present: bool
    go_sum_present: bool
    vendored_dirs: list
  fallback: emit_todo_continue
- id: dep-analysis
  type: local_exec
  description: Extract runtime dependencies from built .deb files, map to source packages, and filter by MIR scope
  inputs:
  - binary_packages
  - series
  - requested_binaries
  depends_on:
  - packaging-source
  - sbuild
  output_contract:
    runtime_deps: list
    deps_not_in_main: list
    dev_debug_doc_packages: list
    dep_source_map: list
    in_scope_deps_not_in_main: list
    out_of_scope_deps_not_in_main: list
    same_source_deps: list
  fallback: emit_todo_continue
  notes: Uses post-build dependencies from sbuild output; maps deps to source packages to identify same-source deps
- id: component-mismatches
  type: local_exec
  description: Run upstream ubuntu-archive-tools/component-mismatches to identify promotion candidates
  inputs:
  - source_package
  - series
  output_contract:
    promotion_candidates: list
    mismatch_report: str
  fallback: emit_todo_continue
  notes: Fetch and run original ubuntu-archive-tools script; no local reimplementation
- id: ubuntu-upload-permission
  type: local_exec
  description: Run ubuntu-upload-permission --list-uploaders to determine who may upload the package
  inputs:
  - source_package
  output_contract:
    raw_output: str
    components: list
    team_uploaders: list
    individual_uploaders: list
  fallback: emit_todo_continue
  notes: From ubuntu-dev-tools; reveals whether only the MOTU team (universe) can upload (typical sync-from-Debian case) versus specific individuals/teams
- id: git-ubuntu-delta
  type: local_exec
  description: Classify the Ubuntu delta vs Debian and, when an Ubuntu revision exists, produce a git-ubuntu diffstat
  inputs:
  - source_package
  output_contract:
    version: str
    delta_kind: str
    delta_present: bool
    diffstat: str
    delta_summary: str
  fallback: emit_todo_continue
  notes: A pure Debian sync (X-Y) carries no Ubuntu delta and git-ubuntu is not run; only ...ubuntuN versions trigger a best-effort git-ubuntu clone and diffstat
- id: autopkgtest-db
  type: web
  description: Query autopkgtest.ubuntu.com/static/autopkgtest.db for test results
  inputs:
  - source_package
  - series
  output_contract:
    test_results: list
    has_autopkgtest: bool
    passing_arches: list
    failing_arches: list
  fallback: emit_todo_continue
- id: dup-search
  type: local_exec
  description: Suggest possible duplicate/overlapping packages by deriving search terms from the package description (LLM) and probing the archive with apt-cache search, tagging each candidate's component
  inputs:
  - source_package
  depends_on:
  - packaging-source
  output_contract:
    search_terms: list
    candidates: list
  fallback: emit_todo_continue
  notes: Best-effort suggestions only; the reviewer (via RDO-1) decides whether any candidate is a genuine functional duplicate. Own binary packages are excluded from candidates.
- id: ubuntu-cve-tracker
  type: web
  description: Search Ubuntu CVE tracker for package-relevant CVEs
  inputs:
  - source_package
  output_contract:
    cves: list
    active_cves: list
    fixed_cves: list
  fallback: emit_todo_continue
- id: cve-search-terms
  type: heuristic
  description: Produce candidate CVE search terms (current package plus historical predecessors)
  inputs:
  - source_package
  output_contract:
    terms: list
  fallback: emit_todo_continue
- id: cvelist-scan
  type: local_exec
  description: Scan the cvelistV5 baseline corpus in the VM to identify candidate CVEs
  inputs:
  - cve-search-terms
  output_contract:
    candidates: list
    baseline: str
  fallback: emit_todo_continue
- id: nvd-enrich
  type: web
  description: Enrich scan candidates with normalized NVD severity, CWE and version ranges
  inputs:
  - cvelist-scan
  output_contract:
    cves: list
    high_severity_cves: list
    historical_cves: list
  fallback: emit_todo_continue
checks:
# ==========================================================================
# Summary
# ==========================================================================
- id: SUM-1
  section: Summary
  title: Source package identified
  mode: deterministic
  blocker_class: hard
  adapters_required:
  - lp-bug-api
  messages:
    ok_message: 'Review for Source Package: {source_package}'
    not_ok_message: Source package could not be determined
    not_ok_todo: 'TODO: Clarify which source package this review is for'
  todo_refs:
  - 'TODO: Review for Source Package: TBDSRC'
  ai_policy: none
- id: SUM-2
  section: Summary
  title: Reporter MIR content present
  mode: deterministic
  blocker_class: hard
  adapters_required:
  - lp-bug-api
  messages:
    ok_message: Reporter MIR content found and used as context.
    nack_message: Reporter MIR template content not found (hard stop)
    nack_todo: 'TODO: - Reporter must post their completed MIR template'
  todo_refs:
  - prerequisite gate before all other checks
  ai_policy: none
- id: SUM-3
  section: Summary
  title: Binary packages to promote
  mode: ev_to_ai
  blocker_class: none
  adapters_required:
  - component-mismatches
  - packaging-source
  adapters_optional:
  - lp-package-api
  messages:
    llm_unavailable_message: 'LLM unavailable: {error}'
  todo_refs:
  - 'TODO: List of specific binary packages to be promoted to main: TBD'
  - 'TODO: Specific binary packages built, but NOT to be promoted to main: TBD'
  ai_policy: Interpret component-mismatch output to identify promotion candidates; summarise.
- id: SUM-4
  section: Summary
  title: Team bug subscriber present
  mode: deterministic
  blocker_class: none
  aggregate_todo: true
  adapters_required:
  - team-mapping
  messages:
    unknown_message: Could not check team subscription (team-mapping adapter failed)
    unknown_todo: 'TODO: - Manually verify package has a team subscriber'
    ok_message: 'Package has team subscriber(s): {subscribed_teams}'
    not_ok_message: Package does not have a team subscriber
    not_ok_todo: 'TODO: - The package should get a team bug subscriber on this bug before being promoted'
  todo_refs:
  - 'TODO: - The package should get a team bug subscriber before being promoted'
  ai_policy: none
- id: SUM-5
  section: Summary
  title: Overall ACK/NACK/ACK-with-conditions
  mode: ai
  blocker_class: none
  synthesis: true
  adapters_required: []
  messages:
    llm_unavailable_message: 'LLM unavailable: {error}'
  todo_refs:
  - 'TODO-A: MIR team ACK'
  - 'TODO-B: MIR team NACK'
  - 'TODO-C: MIR team ACK under the constraint to resolve...'
  options:
  - id: SUM-5-A
    todo_ref: 'TODO-A: MIR team ACK'
    predicate: no required findings and no hard blockers
  - id: SUM-5-B
    todo_ref: 'TODO-B: MIR team NACK'
    predicate: NACK-eligible finding present or reporter content missing
  - id: SUM-5-C
    todo_ref: 'TODO-C: MIR team ACK under the constraint...'
    predicate: required findings present but no NACK-eligible finding
  ai_policy: 'Synthesise all section findings. If zero required findings and zero hard blockers: suggest ACK. If required findings present but package is otherwise sound: suggest ACK-with-conditions listing required TODOs. If fundamental problems exist: suggest NACK. Always mark as requiring human confirmation.'
- id: SUM-6
  section: Summary
  title: Security review needed
  mode: ev_to_ai
  blocker_class: none
  synthesis: true
  adapters_required:
  - ubuntu-cve-tracker
  - nvd-enrich
  - packaging-source
  messages:
    llm_unavailable_message: 'LLM unavailable: {error}'
  todo_refs:
  - 'TODO-A: This does need a security review, so I''ll assign ubuntu-security'
  - 'TODO-B: This does not need a security review'
  options:
  - id: SUM-6-A
    todo_ref: 'TODO-A: This does need a security review'
    predicate: security trigger active or security-sensitive characteristics detected
  - id: SUM-6-B
    todo_ref: 'TODO-B: This does not need a security review'
    predicate: no security triggers and no security-sensitive characteristics
  ai_policy: 'Evaluate security section findings. If any security trigger fires (SEC-1-CVE-SYNTH, SEC-11-ATTESTATION) or package is security-sensitive (parses untrusted data, exposes endpoints, handles auth/crypto), suggest security review needed.'
# ==========================================================================
# Rationale, Duplication and Ownership
# ==========================================================================
- id: RDO-1
  section: Rationale, Duplication and Ownership
  title: No duplicate functionality in main
  mode: ev_to_ai
  blocker_class: soft
  adapters_required:
  - dep-analysis
  - lp-package-api
  adapters_optional:
  - dup-search
  messages:
    llm_unavailable_message: 'LLM unavailable: {error}'
  todo_refs:
  - 'TODO: There is no other package in main providing the same functionality.'
  ai_policy: 'Decide whether another package already provides the same functionality, focusing on packages in main (a duplicate in main makes bug-fixing and security review harder). Use the dup-search evidence: it lists candidate packages found by probing the archive with search terms derived from this package''s description, each tagged with its component (main/universe/...). Reason about genuine FUNCTIONAL overlap, not mere name or keyword similarity, and deduplicate. When credible overlaps exist, name them and their components in the message (e.g. "the archive also ships libaom3 (main) and libdav1d (universe), which also decode AV1") and leave the verdict to the reviewer; a candidate already in main is the most important to surface. When no credible duplicate is found, resolve ok with the template statement. This is a suggestion; the reviewer confirms. Always cite the concrete candidates you considered.'
- id: RDO-2
  section: Rationale, Duplication and Ownership
  title: Owning team committed
  mode: ev_to_ai
  blocker_class: soft
  adapters_required:
  - lp-bug-api
  - lp-team-membership-api
  - team-mapping
  messages:
    llm_unavailable_message: 'LLM unavailable: {error}'
  todo_refs:
  - 'TODO: A team is committed to own long term maintenance of this package.'
  ai_policy: 'Determine whether a team is committed to long-term maintenance. An existing team bug subscription is strong evidence of ownership: if the team-mapping evidence lists one or more subscribed_teams for this package, treat ownership as satisfied (status ok) and name the team(s) in the message; do NOT emit any TODO and never mark this required. If there is no team subscriber, check whether the owning team is explicitly named and acknowledged in the bug comments (a MIR submitted on behalf of another team needs that team to acknowledge ownership). When neither a subscriber nor an explicit acknowledgement is present, emit a recommended (never required) note that a team should confirm ownership; lack of it blocks final promotion by an AA but not the MIR ACK. Reviewer confirms.'
- id: RDO-3
  section: Rationale, Duplication and Ownership
  title: Rationale valid and useful for Ubuntu
  mode: ev_to_ai
  blocker_class: soft
  adapters_required:
  - lp-bug-api
  adapters_optional:
  - dep-analysis
  messages:
    llm_unavailable_message: 'LLM unavailable: {error}'
  todo_refs:
  - 'TODO: The rationale given in the report seems valid and useful for Ubuntu'
  ai_policy: "Analyse the reporter's stated rationale. Check for: clear Ubuntu user benefit, whether the request is based on correct assumptions about what needs to be in main, and whether reverse-dep analysis supports the stated need. Produce a tentative verdict suggestion. Always require human confirmation \u2014 this is a judgment call."
# ==========================================================================
# Dependencies
# ==========================================================================
- id: DEP-1
  section: Dependencies
  title: No unresolved runtime dependencies needing MIR
  mode: deterministic
  blocker_class: hard
  adapters_required:
  - dep-analysis
  - packaging-source
  messages:
    unknown_adapter_message: Could not analyse runtime dependencies
    unknown_adapter_todo: 'TODO: - Verify no runtime dependencies in universe need MIR'
    not_ok_message: 'Runtime dependencies from other source packages outside main: {deps}'
    not_ok_todo: 'TODO: - File MIR for runtime dependencies from other source packages: {deps}'
    ok_message: no runtime dependencies outside main needing MIR
  todo_refs:
  - 'TODO: - no other runtime Dependencies to MIR due to this'
  ai_policy: none
  notes: 'Do not use check-mir (outdated). Use dpkg-query to extract runtime deps from installed binaries, then apt policy to verify component in target release. Only runtime deps matter unless language/headers embed active code in binaries.'
- id: DEP-2
  section: Dependencies
  title: No build-time deps with active code in final binaries
  mode: ev_to_ai
  blocker_class: hard
  adapters_required:
  - dep-analysis
  - sbuild
  - packaging-source
  messages:
    llm_unavailable_message: 'LLM unavailable: {error}'
  todo_refs:
  - 'TODO: - no other build-time Dependencies with active code in the final binaries to MIR due to this'
  ai_policy: 'Identify language/toolchain patterns that embed build deps into final binaries (e.g. Go static builds, C header-only libraries with active code, Rust vendoring). Check Built-Using and Static-Built-Using. AI assesses risk; reviewer confirms.'
- id: DEP-3
  section: Dependencies
  title: No -dev/-debug/-doc packages needing exclusion
  mode: deterministic
  blocker_class: none
  adapters_required:
  - dep-analysis
  - component-mismatches
  - packaging-source
  messages:
    unknown_packaging_message: Could not analyse binary packages
    unknown_packaging_todo: 'TODO: - Check whether -dev/-debug/-doc packages need exclusion'
    unknown_dep_analysis_message: Could not analyse auto-included binary dependencies
    unknown_dep_analysis_todo: 'TODO: - Check whether auto-included -dev/-debug/-doc packages need exclusion'
    ok_no_auto_included_message: no -dev/-debug/-doc packages that need exclusion
    not_ok_offending_message: 'Auto-included binaries ({auto_included}) pull dependencies outside main or with unknown component: {offending_deps}'
    not_ok_offending_todo: 'TODO: - Consider adding extra-excludes for auto-included binaries with offending dependencies ({details}); otherwise MIR may also be needed for: {offending_deps}'
    ok_safe_message: Auto-included binaries ({auto_included}) will be auto-included, and have no dependencies outside main
  todo_refs:
  - 'TODO: - no -dev/-debug/-doc packages that need exclusion'
  ai_policy: none
  notes: 'Not a hard blocker by itself. Only matters if -dev/-debug/-doc packages would create additional component mismatches. If so, recommend adding extra-excludes.'
- id: DEP-4
  section: Dependencies
  title: Main dependencies not only superficially tested
  mode: ev_to_ai
  blocker_class: none
  adapters_required:
  - dep-analysis
  - autopkgtest-db
  messages:
    llm_unavailable_message: 'LLM unavailable: {error}'
  todo_refs:
  - 'TODO: - No dependencies in main that are only superficially tested requiring more tests now.'
  ai_policy: 'For each runtime dependency already in main, check autopkgtest.db for test coverage and results. Focus on the most intensively-used and important dependencies, not every transitive dep. AI should assess whether existing tests would catch regressions introduced by this package. Weight importance by dep usage, not by counting deps. Result is a suggested assessment; human reviewer makes final call.'
# ==========================================================================
# Embedded sources and static linking
# ==========================================================================
- id: ESL-1
  section: Embedded sources and static linking
  title: No embedded source present
  mode: ev_to_ai
  language_gate: go|rust
  blocker_class: hard
  adapters_required:
  - packaging-source
  - sbuild
  messages:
    unknown_message: Could not collect packaging source and sbuild output
    unknown_todo: 'TODO: - Check for embedded source (evidence collection failed)'
    not_ok_message: 'Embedded source present and used in build: {embedded_dirs}'
    not_ok_todo: 'TODO: - Embedded source found and used in build — either remove and use archive packages, or get security team sign-off. Dirs: {embedded_dirs}'
    ok_built_using_message: 'Built-Using entries present but no embedded source was detected in the package source'
    ok_message: no embedded source present or not used in build
    llm_unavailable_message: 'LLM unavailable: {error}'
  todo_refs:
  - 'TODO: - no embedded source present'
  ai_policy: |
    Evaluate embedded source presence and usage in three dimensions:

    1. IDENTIFICATION: Review the file_listing and vendored_dirs to identify any embedded third-party source code.
       Look for common patterns: vendor/, third_party/, vendored/, lib/, deps/, external/, bundle/, include/, thirdparty/.
       Distinguish between actual embedded third-party code and the package's own lib code.

    2. USAGE: Examine build_hints (extracted compiler/linker flags, vendor path mentions) to determine if the
       embedded source was actually used in the build. Embedded source that exists but is unused is acceptable.
       Look for: compiler invocations referencing vendor paths, static linking of vendor libraries, archive operations on vendor code.

    3. OUTCOME: Return one of three findings:
       - NO EMBEDDED SOURCE: No recognized patterns found. Status: ok, severity: ok
       - EMBEDDED BUT UNUSED: Embedded source detected but NOT referenced in build. Status: ok, severity: ok
         (Include message: "Embedded source present in {dirs}, but not used in build")
       - EMBEDDED AND USED: Embedded source detected AND used in build. Status: not-ok, severity: required
         (Include message: "Embedded source present in {dirs}, used in build — must remove and use archive packages or get security team sign-off")

    If debian/control contains Built-Using or Static-Built-Using entries, note this context but do not treat it as
    automatic justification (ESL-3 handles Built-Using validation separately).
- id: ESL-2
  section: Embedded sources and static linking
  title: No unexpected static linking
  mode: deterministic
  blocker_class: soft
  adapters_required:
  - sbuild
  - packaging-source
  messages:
    unknown_message: Could not inspect build log for static linking
    unknown_todo: 'TODO: - Check build log for static linking'
    ok_message: no static linking
    ok_justified_message: static linking present but appears to be justified (e.g., scanner/bootloader)
    not_ok_detail_binaries: 'statically linked binaries: {binaries}'
    not_ok_detail_hints: 'debian/rules hints: {hints}'
    not_ok_message: 'Static linking detected without clear justification; review needed{detail}'
    not_ok_todo: 'TODO: - no static linking'
  negated_statement: static linking present without clear justification
  todo_refs:
  - 'TODO: - no static linking'
  ai_policy: none
  notes: 'Check build log for ''-static'' flag in compiler/linker invocations. Inspect ldd output on installed binaries. Check Built-Using/Static-Built-Using. Distinguish acceptable static linking (integrity scanner, etc.) from unwanted.'
- id: ESL-3
  section: Embedded sources and static linking
  title: No unexpected Built-Using entries
  mode: deterministic
  blocker_class: soft
  adapters_required:
  - deb-metadata
  messages:
    unknown_message: Could not collect binary package metadata (deb-metadata collection failed)
    unknown_todo: 'TODO: - Check for unexpected Built-Using entries'
    ok_message: does not have unexpected Built-Using entries
    ok_toolchain_message: 'Built-Using entries present but appear to be standard toolchain entries: {entries}'
    not_ok_message: 'Unexpected Built-Using entries that may indicate untracked embedded source: {entries}'
    not_ok_todo: 'TODO: - Review Built-Using entries — possible untracked embedded source: {entries}'
  todo_refs:
  - 'TODO: - does not have unexpected Built-Using entries'
  ai_policy: none
- id: ESL-4
  section: Embedded sources and static linking
  title: Go language detection gate
  mode: deterministic
  language_gate: go
  blocker_class: none
  adapters_required:
  - packaging-source
  messages:
    unknown_message: Could not determine language (packaging-source failed)
    unknown_todo: 'TODO: - Determine if this is a Go package'
    ok_go_message: 'Go Package — Debian Go packaging guidelines apply (see ESL-5/6/7)'
    ok_not_go_message: not a go package, no extra constraints to consider in that regard
  todo_refs:
  - 'TODO-A: - not a go package, no extra constraints to consider in that regard'
  - 'TODO-B: - Go Package that follows the Debian Go packaging guidelines'
  options:
  - id: ESL-4-A
    todo_ref: TODO-A
    predicate: no Go source detected
    render: '- not a go package, no extra constraints to consider in that regard'
  - id: ESL-4-B
    todo_ref: TODO-B
    predicate: Go source detected
    render: '- Go Package'
  ai_policy: none
- id: ESL-5
  section: Embedded sources and static linking
  title: 'Go: follows Debian/Ubuntu Go packaging guidelines'
  mode: ev_to_ai
  language_gate: go
  blocker_class: soft
  adapters_required:
  - packaging-source
  - sbuild
  messages:
    llm_unavailable_message: 'LLM unavailable: {error}'
  todo_refs:
  - 'TODO-B: - Go Package that follows the Debian Go packaging guidelines'
  ai_policy: 'Ubuntu rules override Debian guidelines where they conflict. Check: dh-golang used, Built-Using: ${misc:Built-Using} present for non-dev binaries, go.sum present. Assess vendoring against Ubuntu MIR policy (vendoring may be acceptable or even recommended; dialogue with reporter is often appropriate).'

- id: ESL-6
  section: Embedded sources and static linking
  title: 'Go: vendoring documented and justified'
  mode: ev_to_ai
  language_gate: go

[project]
name = "auto-mir"
version = "0.1.0"
description = "Automated MIR (Main Inclusion Review) assistant"
requires-python = ">=3.12"
# This tool is designed to run against Ubuntu system/apt-installed packages
# (see utils/dependencies.py::RUNTIME_DEPENDENCIES for the apt package name
# each distribution below maps to), not a project-local virtualenv - that is
# a deliberate choice, not an oversight: auto-mir orchestrates lxc/apt-get and
# expects to run directly on a host's system Python. This `dependencies` list
# exists only so packaging/dev tooling (pip metadata, IDE dependency
# resolution) understands what the project needs; it is NOT what actually
# gets installed at runtime. tests/test_dependencies.py::
# test_runtime_registry_matches_pyproject_dependencies asserts this list and
# RUNTIME_DEPENDENCIES name exactly the same distributions, so the two can
# never silently drift apart.
dependencies = [
    "launchpadlib",
    "pyyaml",
    "python-json-logger",
    "tenacity>=8.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# These test fixture files contain catalog message strings that intentionally mirror
# catalog-mir-review.yaml verbatim. Splitting them across lines would obscure their
# relationship to the source data and make the test table harder to audit.
"tests/test_checks.py" = ["E501"]
"tests/test_catalog.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[project]
name = "auto-mir"
version = "0.1.0"
description = "Automated MIR (Main Inclusion Review) assistant"
requires-python = ">=3.12"
dependencies = [
    "launchpadlib",
    "pyyaml",
    "python-json-logger",
    "tenacity>=8.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
